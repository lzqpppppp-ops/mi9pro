          SOURCE
          base64 -d /tmp/watch-project.b64 >/tmp/watch-project.zip
          unzip -q /tmp/watch-project.zip -d .
          python3 - <<'PYCHK'
          import json, pathlib
          p = json.loads(pathlib.Path('src/manifest.json').read_text())
          assert p['router']['entry'] == 'Index'
          assert pathlib.Path('src/Index/index.ux').is_file()
          assert pathlib.Path('src/Test/index.ux').is_file()
          assert p['router']['pages']['Test']['path'] == '/test'
          print('Source OK:', p['package'], p['versionName'])
          PYCHK
      - name: Install AIoT toolkit
        run: npm install --no-audit --no-fund
      - name: Compile watch RPK
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/build.log
          if grep -E -q 'Compilation failed|webpack error|build error' /tmp/build.log; then
            echo 'AIoT toolkit reported a compilation error'
            exit 1
          fi
          find . -type f -name '*.rpk' -not -path './node_modules/*' -print
          mkdir -p artifacts
          find . -type f -name '*.rpk' -not -path './node_modules/*' -exec cp '{}' artifacts/ \;
          python3 - <<'PYRPK'
          import pathlib, zipfile, json
          rpks=list(pathlib.Path('artifacts').glob('*.rpk'))
          assert rpks, 'No RPK created (see Compile watch RPK logs)'
          for p in rpks:
            with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, 'CRC error'
              m=json.loads(z.read('manifest.json'))
              assert m['package']=='com.example.mi9prosensors.lab', m
              assert m['versionName']=='0.3.0', m
              paths=z.namelist()
              assert any(x.endswith('Index/index.js') for x in paths), paths
              assert any(x.endswith('Test/index.js') for x in paths), paths
              print('Verified RPK',p,'files:',len(paths))
          PYRPK
      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: Band9Pro-SensorLab-V030
          path: artifacts/*.rpk
          if-no-files-found: error
